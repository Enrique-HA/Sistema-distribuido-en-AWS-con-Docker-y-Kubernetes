apiVersion: apps/v1
kind: Deployment
metadata:
  name: servidor-rpc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: servidor-rpc
  template:
    metadata:
      labels:
        app: servidor-rpc
    spec:
      terminationGracePeriodSeconds: 5
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: servidor-rpc
      containers:
        - name: servidor-rpc
          image: servidor-rpc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: servidor-rpc-service
spec:
  type: NodePort
  selector:
    app: servidor-rpc
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500